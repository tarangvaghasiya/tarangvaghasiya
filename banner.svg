<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Smoothly cycling background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027">
        <animate attributeName="stop-color"
          values="#0F2027;#1b1035;#0F2027"
          dur="8s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </stop>
      <stop offset="50%" stop-color="#2C5364">
        <animate attributeName="stop-color"
          values="#2C5364;#3d2c6e;#2C5364"
          dur="8s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </stop>
      <stop offset="100%" stop-color="#6C63FF">
        <animate attributeName="stop-color"
          values="#6C63FF;#00C2CB;#6C63FF"
          dur="8s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </stop>
    </linearGradient>

    <!-- Shimmering sweep gradient for the title text -->
    <linearGradient id="textGrad" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#9d8cff"/>
      <stop offset="55%" stop-color="#00e5d4"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="0 0; 1600 0; 0 0" dur="6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.37 0 0.63 1;0.37 0 0.63 1"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="typeClip">
      <rect x="0" y="0" height="40" width="0">
        <animate attributeName="width" from="0" to="560" begin="1.6s" dur="1.6s"
          fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <circle cx="600" cy="150" r="260" fill="url(#glow)">
    <animate attributeName="r" values="240;280;240" dur="6s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>

  <!-- Floating code-symbol particles, each with its own smooth vertical drift -->
  <g fill="#ffffff" opacity="0.16" font-family="JetBrains Mono, monospace">
    <text x="90" y="70" font-size="24">{'}'}
      <animate attributeName="y" values="70;54;70" dur="4.4s" begin="0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </text>
    <text x="1080" y="230" font-size="24">{'{'}
      <animate attributeName="y" values="230;214;230" dur="5.1s" begin="0.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </text>
    <text x="150" y="235" font-size="22">&lt;/&gt;
      <animate attributeName="y" values="235;221;235" dur="4.8s" begin="1.1s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </text>
    <text x="1010" y="55" font-size="22">01
      <animate attributeName="y" values="55;40;55" dur="5.6s" begin="1.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </text>
    <text x="610" y="35" font-size="26">;
      <animate attributeName="y" values="35;20;35" dur="4.2s" begin="0.3s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </text>
    <text x="55" y="150" font-size="24">&#955;
      <animate attributeName="y" values="150;134;150" dur="5.3s" begin="2s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </text>
  </g>

  <!-- Title: fades + rises in, then shimmers -->
  <g transform="translate(600,118)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0 24; 0 0" begin="0.1s" dur="1s" fill="freeze"
      calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <text x="0" y="0" text-anchor="middle"
      font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700"
      fill="url(#textGrad)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="1s" fill="freeze"/>
      TARANG VAGHASIYA
    </text>
  </g>

  <!-- Subtitle: typewriter reveal -->
  <g transform="translate(320,175)" clip-path="url(#typeClip)">
    <text x="0" y="28" font-family="JetBrains Mono, monospace" font-size="22" fill="#e6e6ff">
      B.Tech CSE Student @ CodingGita
    </text>
  </g>
  <!-- Blinking cursor -->
  <rect x="882" y="150" width="3" height="28" fill="#00e5d4" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.53;0.6;1"
      begin="0s" dur="3.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" begin="3.4s" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Parallax animated wave footer, two smooth layers -->
  <path d="M0,260 C200,230 400,290 600,260 C800,230 1000,290 1200,260 L1200,300 L0,300 Z"
        fill="#00C2CB" opacity="0.25">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
      values="
        M0,260 C200,230 400,290 600,260 C800,230 1000,290 1200,260 L1200,300 L0,300 Z;
        M0,270 C200,300 400,240 600,270 C800,300 1000,240 1200,270 L1200,300 L0,300 Z;
        M0,260 C200,230 400,290 600,260 C800,230 1000,290 1200,260 L1200,300 L0,300 Z"/>
  </path>
  <path d="M0,275 C250,250 450,300 700,275 C900,255 1050,300 1200,275 L1200,300 L0,300 Z"
        fill="#6C63FF" opacity="0.35">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
      values="
        M0,275 C250,250 450,300 700,275 C900,255 1050,300 1200,275 L1200,300 L0,300 Z;
        M0,285 C250,300 450,255 700,285 C900,300 1050,255 1200,285 L1200,300 L0,300 Z;
        M0,275 C250,250 450,300 700,275 C900,255 1050,300 1200,275 L1200,300 L0,300 Z"/>
  </path>
</svg>
